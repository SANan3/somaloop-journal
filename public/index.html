<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SomaLoop Journal</title>
<meta name="description" content="A morning somatic journal: mark how your body feels on a body map and get a read-back grounded in your own log.">
<meta name="theme-color" content="#F6F8F8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='9' cy='13' r='6.2' fill='none' stroke='%2300BFAE' stroke-width='2.6'/%3E%3Ccircle cx='17' cy='13' r='6.2' fill='none' stroke='%2303786E' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sen:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phones get one column with the body map in the flow; laptops get the body map pinned on the left and the log or read-back on the right. */
:root {
  --bg: #F9F9F9; --surface: #FFFFFF; --ink: #0A0A0A; --ink-2: #55595A; --ink-3: #8C9090; --line: #E7E7E7;
  --teal: #00D6C1; --teal-deep: #00877A; --teal-wash: #DDF8F4; --teal-ink: #00564E;
  --body-base: #D8DDDC; --muscle: #F2F4F4; --muscle-hover: #E2F7F4; --outline: #8C9393;
  --lv-tight: rgba(10,10,10,.25); --lv-tender: rgba(10,10,10,.5); --lv-sore: rgba(10,10,10,.8); --pain: #EE732B;
  --area-tight: #A9EEE6; --area-tender: #2FD6C4; --area-sore: #00897C;
  --pain-wash: #FDEDE3; --pain-ink: #8A3A0C; --heat: #00877A;
  --font-ui: "Sen", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg: 22px; --r-md: 14px; --r-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1313; --surface: #161D1D; --ink: #EDF0EF; --ink-2: #A6B0AF; --ink-3: #6F7A79; --line: #273130;
  --teal: #1FE0CC; --teal-deep: #46D3C4; --teal-wash: #10332F; --teal-ink: #BFF4EC;
  --body-base: #3A4545; --muscle: #26302F; --muscle-hover: #1C3D39; --outline: #6E7A79;
  --lv-tight: rgba(237,240,239,.3); --lv-tender: rgba(237,240,239,.55); --lv-sore: rgba(237,240,239,.88); --pain: #FF8A4A;
  --area-tight: #1D4D47; --area-tender: #13A091; --area-sore: #45EAD8;
  --pain-wash: #3A2014; --pain-ink: #FFC9A8; --heat: #2FD3C2; color-scheme: dark} }
:root[data-theme="dark"] {
  --bg: #0E1313; --surface: #161D1D; --ink: #EDF0EF; --ink-2: #A6B0AF; --ink-3: #6F7A79; --line: #273130;
  --teal: #1FE0CC; --teal-deep: #46D3C4; --teal-wash: #10332F; --teal-ink: #BFF4EC;
  --body-base: #3A4545; --muscle: #26302F; --muscle-hover: #1C3D39; --outline: #6E7A79;
  --lv-tight: rgba(237,240,239,.3); --lv-tender: rgba(237,240,239,.55); --lv-sore: rgba(237,240,239,.88); --pain: #FF8A4A;
  --area-tight: #1D4D47; --area-tender: #13A091; --area-sore: #45EAD8;
  --pain-wash: #3A2014; --pain-ink: #FFC9A8; --heat: #2FD3C2; color-scheme: dark}

* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px) }
html, body { margin: 0 }
[hidden] { display: none !important }
#view { display: flex; flex-direction: column; gap: 20px }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; font-weight: 400;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px }
.app { max-width: 460px; margin: 0 auto; padding-block: 0 104px; display: flex; flex-direction: column; gap: 20px }

/* Top */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; padding-block: 12px; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 500; letter-spacing: .01em }
.brand svg { width: 26px; height: 26px }
.mode { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px }
.mode button { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); font-size: 13px; color: var(--ink-2) }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 500 }
.greet { display: flex; flex-direction: column; gap: 2px }
.greet h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.01em; text-wrap: balance }
.date { font-family: var(--font-data); font-size: 12px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase }
.banner { font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-md); padding: 10px 12px }
.banner b { color: var(--ink); font-weight: 500 }

/* Section headings */
.label { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 }
.sect { display: flex; flex-direction: column; gap: 10px }
.sect h2 { margin: 0; font-size: 17px; font-weight: 500 }
.hint { margin: 0; font-size: 13px; color: var(--ink-2) }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-pill); padding: 6px 14px; font-size: 14px; font-weight: 500; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: background .15s ease, color .15s ease, box-shadow .15s ease }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.chip.sens[data-s="tight"] { border-color: var(--lv-tight) }
.chip.sens[data-s="tender"] { border-color: var(--lv-tender) }
.chip.sens[data-s="sore"] { border-color: var(--lv-sore) }
.chip.sens[data-s="pain"] { border-color: var(--pain) }
.chip.sens[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 20%, transparent), 0 0 12px color-mix(in srgb, var(--teal) 30%, transparent) }
.chip.sens[data-s="pain"][aria-pressed="true"] { border-color: var(--pain); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pain) 20%, transparent), 0 0 12px color-mix(in srgb, var(--pain) 30%, transparent) }
.chip.add { padding: 6px 11px; color: var(--ink-2); border-style: dashed }
.chip.add svg { width: 14px; height: 14px }
.def { margin: 0; font-size: 14px; color: var(--ink-2); min-height: 1.5em }
.def b { color: var(--ink); font-weight: 600 }
.seg4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px }
.seg4 button { border: 0; border-radius: var(--r-pill); padding: 7px 4px; font-size: 13px; font-weight: 500; background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); white-space: nowrap }
.seg4 button[aria-pressed="true"] { background: var(--ink); color: var(--surface) }
.sessions { display: flex; flex-direction: column; gap: 8px }
.session { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px }
.session-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 14px }
.session-head .sname { font-weight: 600 }
.session-head .shint { color: var(--ink-3); font-size: 13px }
.addform { display: flex; gap: 8px; align-items: center }
.addform input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-pill); padding: 7px 14px }
.addform input:focus { border-color: var(--teal); outline: none }
.addform .btn, .addform .btn.primary { flex: 0 0 auto; width: auto; padding: 8px 16px; font-size: 14px }
.d-tight { background: var(--area-tight) } .d-tender { background: var(--area-tender) } .d-sore { background: var(--area-sore) } .d-pain { background: var(--pain) }

/* Body map */
.mapwrap { position: relative; background: var(--surface); border-radius: var(--r-lg); padding: 18px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; border: 1px solid var(--line) }
.figure { height: min(62vh, 470px); width: auto; max-width: 100%; display: block; touch-action: manipulation }
.figure .b { fill: var(--body-base) }
.figure .x { fill: var(--outline); opacity: .6 }
.figure .m { fill: var(--muscle); transition: fill .15s ease, fill-opacity .15s ease }
.figure.live .m { cursor: pointer }
.figure.live .m:hover { fill: var(--muscle-hover) }
.figure, .figure * { -webkit-tap-highlight-color: transparent }
.figure .m:focus { outline: none }
.figure .m:focus-visible { stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke }
.figure .m.last { stroke: color-mix(in srgb, var(--ink) 45%, transparent); stroke-width: 1.2; vector-effect: non-scaling-stroke }
.figure .m.s-tight, .figure.live .m.s-tight:hover { fill: var(--area-tight) }
.figure .m.s-tender, .figure.live .m.s-tender:hover { fill: var(--area-tender) }
.figure .m.s-sore, .figure.live .m.s-sore:hover { fill: var(--area-sore) }
.figure .m.s-pain, .figure.live .m.s-pain:hover { fill: var(--pain) }
.figure .m.h1 { fill: var(--heat); fill-opacity: .25 } .figure .m.h2 { fill: var(--heat); fill-opacity: .55 } .figure .m.h3 { fill: var(--heat); fill-opacity: .9 }
.figure .stop-a { stop-color: var(--outline) } .figure .stop-b { stop-color: var(--teal) }
.side-tag { position: absolute; top: 2px; z-index: 1; font-family: var(--font-data); font-size: 11px; color: var(--ink-3); letter-spacing: .06em }
.side-tag.l { left: 14px } .side-tag.r { right: 14px }
.slides { display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain }
.slides::-webkit-scrollbar { display: none }
.slide { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px }
.slide-cap { display: none; font-family: var(--font-data); font-size: 11px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase }
.maprow { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px }
.clearmap { justify-self: end; border: 0; background: none; color: var(--ink-2); font-size: 13px; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line) }
.clearmap:disabled { color: var(--ink-3); opacity: .5; cursor: default; text-decoration: none }
.scale { display: flex; flex-wrap: wrap; gap: 8px }
.lvl { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-pill); padding: 6px 14px; font-size: 14px; font-weight: 500; color: var(--ink); transition: background .15s ease, color .15s ease, box-shadow .15s ease }
.lvl[data-s="tight"] { border-color: var(--lv-tight) } .lvl[data-s="tender"] { border-color: var(--lv-tender) } .lvl[data-s="sore"] { border-color: var(--lv-sore) } .lvl[data-s="pain"] { border-color: var(--pain) }
.lvl[data-on="true"] { background: var(--ink); color: var(--surface); border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 20%, transparent), 0 0 12px color-mix(in srgb, var(--teal) 30%, transparent) }
.lvl[data-s="pain"][data-on="true"] { border-color: var(--pain); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pain) 20%, transparent), 0 0 12px color-mix(in srgb, var(--pain) 30%, transparent) }
.def .linkbtn { padding: 0 2px; font-size: inherit }
.toggle { display: grid; grid-template-columns: 1fr 1fr; width: 200px; background: var(--bg); border-radius: var(--r-pill); padding: 3px; border: 1px solid var(--line) }
.toggle button { border: 0; background: none; border-radius: var(--r-pill); padding: 7px 0; font-size: 14px; color: var(--ink-2) }
.toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1.5px var(--teal) }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 8px 10px }
.pair figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px }
.pair figcaption { font-family: var(--font-data); font-size: 11px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase }
.pair .figure { height: 280px }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); justify-content: center }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block }

/* Marks list */
.marks { display: flex; flex-direction: column; gap: 6px }
.mark { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 8px 8px 8px 12px; font-size: 14px }
.mark[data-s="tight"] { border-color: var(--lv-tight) } .mark[data-s="tender"] { border-color: var(--lv-tender) } .mark[data-s="sore"] { border-color: var(--lv-sore) } .mark[data-s="pain"] { border-color: var(--pain) }
.mark .name { flex: 1; min-width: 0; font-weight: 500 }
.mark .meta { color: color-mix(in srgb, var(--ink-3) 85%, var(--surface)); font-size: 12.5px; text-align: right }
.mark .meta b { color: var(--ink-3); font-weight: 500 }
.mark button { border: 0; background: none; width: 30px; height: 30px; border-radius: 50%; color: var(--ink-3); font-size: 18px; line-height: 1 }
.mark button:hover { background: var(--bg); color: var(--ink) }
.empty { font-size: 14px; color: var(--ink-3); padding: 4px 2px }

.notewrap { position: relative }
.notewrap textarea { padding-right: 52px }
.mic { position: absolute; right: 8px; bottom: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center }
.mic svg { width: 18px; height: 18px }
.mic[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 25%, transparent); animation: listen 1.4s ease-in-out infinite }
@keyframes listen { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--teal) 12%, transparent) } }
textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px }

/* Primary action */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5 }
.dock-inner { max-width: 460px; margin: 0 auto; display: flex; gap: 10px; align-items: center }
.btn { border: 0; border-radius: var(--r-pill); padding: 13px 20px; font-size: 15px; font-weight: 500 }
.btn.primary { background: var(--teal); color: #0A0A0A; flex: 1 }
.btn.primary:disabled { opacity: .55; cursor: default }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink) }
.tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 4px }
.tabs button { border: 0; background: none; border-radius: var(--r-pill); padding: 9px 16px; font-size: 14px; color: var(--ink-2) }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 500 }
.status { font-size: 13px; color: var(--ink-2); text-align: center; min-height: 1.2em }

/* Read-back */
.coach { border-radius: var(--r-lg); padding: 20px; background: linear-gradient(165deg, var(--teal-wash), var(--surface) 78%); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px }
.coach h2 { margin: 0; font-size: 21px; font-weight: 500; line-height: 1.3; text-wrap: balance }
.coach p { margin: 0; color: var(--ink) }
.byline { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-2); letter-spacing: .02em }
.writing { color: var(--ink-2) }
.rule { border-radius: var(--r-lg); padding: 16px 18px; background: var(--pain-wash); color: var(--pain-ink); display: flex; flex-direction: column; gap: 6px }
.rule .label { color: var(--pain-ink); opacity: .85 }
.rule p { margin: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px }
.call { display: inline-flex; align-self: flex-start; align-items: center; gap: 7px; border-radius: var(--r-pill); padding: 4px 12px; font-size: 13px; font-weight: 500 }
.call.train { background: var(--teal-wash); color: var(--teal-ink) }
.call.modify { background: color-mix(in srgb, var(--pain) 16%, var(--surface)); color: var(--ink) }
.call.rest { background: color-mix(in srgb, var(--ink) 8%, var(--surface)); color: var(--ink) }
.card h3 { margin: 0; font-size: 17px; font-weight: 500 }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px }
.pattern { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line) }
.pattern:first-of-type { border-top: 0; padding-top: 0 }
.pattern p { margin: 0 }
.ev { display: flex; flex-wrap: wrap; gap: 6px }
.ev button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; font-family: var(--font-data); font-size: 11.5px; padding: 2px 8px; color: var(--ink-2) }
.ev button[aria-expanded="true"] { border-color: var(--teal); color: var(--teal-ink); background: var(--teal-wash) }
.evtext { font-size: 13px; color: var(--ink-2); background: var(--bg); border-radius: 10px; padding: 8px 10px }
.conf { display: flex; align-items: center; gap: 10px; font-size: 14px }
.meter { display: inline-flex; gap: 4px }
.meter i { width: 18px; height: 6px; border-radius: 3px; background: var(--line) }
.meter i.on { background: var(--teal) }
details.how { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 18px }
details.how summary { cursor: pointer; font-weight: 500 }
details.how ol { margin: 10px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 8px }
details.how li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; font-size: 14px }
details.how li code { font-family: var(--font-data); font-size: 12px; color: var(--teal-deep); padding-top: 1px }
details.how .fine { font-size: 13px; color: var(--ink-2); margin: 12px 0 0 }

/* History */
.rows { display: flex; flex-direction: column; gap: 8px }
.row { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; text-align: left; width: 100% }
.row:hover { border-color: var(--teal) }
.row .d { font-family: var(--font-data); font-size: 12.5px; color: var(--ink-2) }
.row .sum { min-width: 0; font-size: 14px; display: flex; flex-direction: column; gap: 2px }
.row .sum small { color: var(--ink-3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.dots { display: inline-flex; gap: 3px; flex-wrap: wrap }
.dots i { width: 8px; height: 8px; border-radius: 50% }
.callmini { font-size: 12px; color: var(--ink-2); font-family: var(--font-data) }
.tops { display: flex; flex-direction: column; gap: 8px }
.top-row { display: grid; grid-template-columns: 1fr 120px 28px; gap: 10px; align-items: center; font-size: 14px }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--heat) }
.num { font-family: var(--font-data); font-size: 12.5px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums }
.back { border: 0; background: none; color: var(--teal-deep); padding: 0; font-size: 14px; align-self: flex-start }
.loading { padding: 40px 0; text-align: center; color: var(--ink-2) }
.topright { display: flex; align-items: center; gap: 10px }
.linkbtn { border: 0; background: none; color: var(--ink-2); font-size: 13px; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line) }
.linkbtn:hover { color: var(--ink) }
.ownerform { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px }
.ownerform label { font-size: 14px; font-weight: 500 }
.ownerform input { flex: 1 1 160px; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 9px 14px }
.ownerform .btn { padding: 9px 16px; font-size: 14px }
.ownerform .btn.primary { flex: none }
.ownerform .status { flex-basis: 100%; text-align: left; margin: 0 }
.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "ctrl" "map" "rest" }
.layout.read { grid-template-areas: "head" "rest" "map" }
.layout.hist { grid-template-areas: "head" "map" "rest" }
.a-head { grid-area: head } .a-ctrl { grid-area: ctrl } .a-map { grid-area: map } .a-rest { grid-area: rest }
.a-head, .a-ctrl, .a-map, .a-rest { display: flex; flex-direction: column; gap: 20px; min-width: 0 }
.dock-box { display: flex; gap: 10px; align-items: center; flex: 1; min-width: 0 }
.demo-wrap { align-self: flex-start; display: flex; align-items: flex-start; gap: 6px; max-width: 100% }
.demo-x { flex: none; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink-2); display: grid; place-items: center; padding: 0 }
.demo-x svg { width: 11px; height: 11px }
.demo-x:hover { color: var(--ink); border-color: var(--ink-3) }
details.demo { min-width: 0; font-size: 13px; color: var(--ink-2) }
details.demo summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 4px 12px 4px 10px; color: var(--ink-2) }
details.demo summary::-webkit-details-marker { display: none }
details.demo summary::after { content: "What’s this?"; color: var(--ink-3); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line) }
details.demo[open] summary::after { content: "Hide" }
details.demo summary .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal) }
details.demo p { margin: 8px 2px 0; max-width: 46ch; line-height: 1.5 }
.toptabs { display: none }
.actionbar { display: none }
.foot { font-size: 12.5px; color: var(--ink-3); text-align: center; padding-top: 8px }
.sect-head { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.mini-tabs { display: inline-flex; background: color-mix(in srgb, var(--ink) 5%, transparent); border-radius: var(--r-pill); padding: 3px }
.mini-tabs button { border: 0; background: none; border-radius: var(--r-pill); padding: 4px 12px; font-size: 13px; font-weight: 500; color: var(--ink-2) }
.mini-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1.5px var(--teal) }
.cal { gap: 14px }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.cal-nav { display: flex; align-items: center; gap: 4px }
.cal-nav button { border: 0; background: none; width: 30px; height: 30px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--ink) }
.cal-nav button:hover:not(:disabled) { background: var(--bg) }
.cal-nav button:disabled { color: var(--ink-3); opacity: .4; cursor: default }
.cal-title { font-weight: 600; min-width: 8.5em; text-align: center }
.calwrap { display: grid; gap: 14px; align-items: start }
.calwrap.is-month { grid-template-columns: auto minmax(0, 1fr) }
.cgrid { display: grid; grid-template-columns: repeat(7, 26px); gap: 4px 4px; justify-items: center }
.cwk { font-size: 11px; color: var(--ink-3); font-weight: 500; padding-bottom: 2px }
.cday { width: 26px; height: 26px; border: 0; padding: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer }
.cday:disabled { cursor: default }
.cday::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 16%, transparent); transition: transform .12s ease }
.cday.future::before { background: color-mix(in srgb, var(--ink) 6%, transparent) }
.cday.clear::before { width: 10px; height: 10px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--teal) }
.cday.lv-tight::before, .cday.lv-tender::before, .cday.lv-sore::before, .cday.lv-pain::before { width: 12px; height: 12px }
.cday.lv-tight::before { background: var(--area-tight) } .cday.lv-tender::before { background: var(--area-tender) } .cday.lv-sore::before { background: var(--area-sore) } .cday.lv-pain::before { background: var(--pain) }
.cday.today.empty::before { background: var(--ink); width: 10px; height: 10px }
.cday.today { box-shadow: inset 0 0 0 1.5px var(--ink) }
.cday.sel { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal) 70%, transparent) }
.cday.pin { box-shadow: inset 0 0 0 2px var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent) }
.cd-head { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.cd-pin { border: 0; border-radius: var(--r-pill); background: var(--ink); color: var(--surface); font-size: 11.5px; font-weight: 500; padding: 2px 9px }
.cd-pin span { opacity: .7; margin-left: 2px }
.cday:not(:disabled):hover::before { transform: scale(1.2) }
.cal-detail { background: color-mix(in srgb, var(--ink) 4%, var(--surface)); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 100% }
.cd-title { margin: 0; font-weight: 600; font-size: 15px }
.cd-marks { display: flex; flex-direction: column; gap: 4px }
.cd-mark { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; border: 1.5px solid var(--line); border-radius: 10px; padding: 3px 8px; background: var(--surface) }
.cd-mark b { font-weight: 500; color: var(--ink-2) }
.cd-mark[data-s="tight"] { border-color: var(--lv-tight) } .cd-mark[data-s="tender"] { border-color: var(--lv-tender) } .cd-mark[data-s="sore"] { border-color: var(--lv-sore) } .cd-mark[data-s="pain"] { border-color: var(--pain) }
.cd-more, .cd-meta { margin: 0; font-size: 13px; color: var(--ink-2) }
.cd-open { align-self: flex-start; padding: 2px 0; color: var(--teal-deep) }
.cyear { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px }
.cmonth { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.cm-name { font-size: 12px; font-weight: 600; color: var(--ink-2) }
.cgrid.mini { grid-template-columns: repeat(7, minmax(0, 12px)); gap: 2px }
.cgrid.mini .cday { width: 12px; height: 12px }
.cgrid.mini .cday::before { width: 4px; height: 4px }
.cgrid.mini .cday.clear::before { width: 7px; height: 7px; box-shadow: inset 0 0 0 1px var(--teal) }
.cgrid.mini .cday.lv-tight::before, .cgrid.mini .cday.lv-tender::before, .cgrid.mini .cday.lv-sore::before, .cgrid.mini .cday.lv-pain::before { width: 8px; height: 8px }
.cgrid.mini .cday.today.empty::before { width: 6px; height: 6px }
.cgrid.mini .cday.today, .cgrid.mini .cday.sel { box-shadow: inset 0 0 0 1px var(--teal) }
.cgrid.mini .cday.pin { box-shadow: inset 0 0 0 1.5px var(--teal); background: color-mix(in srgb, var(--teal) 18%, transparent) }
.cgrid.mini .cday.today:not(.sel) { box-shadow: inset 0 0 0 1px var(--ink) }
.cal-key { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2) }
.cal-key span { display: inline-flex; align-items: center; gap: 6px }
.cal-key .k { width: 9px; height: 9px; border-radius: 50%; display: inline-block }
.cal-key .k.lv-tight { background: var(--area-tight) } .cal-key .k.lv-tender { background: var(--area-tender) } .cal-key .k.lv-sore { background: var(--area-sore) } .cal-key .k.lv-pain { background: var(--pain) } .cal-key .k.clear { box-shadow: inset 0 0 0 1.5px var(--teal) }
@media (max-width: 479px) { .calwrap.is-month { grid-template-columns: 1fr } .calwrap.is-month .cgrid { justify-content: center; grid-template-columns: repeat(7, 36px) } .calwrap.is-month .cday { width: 34px; height: 34px } }
@media (min-width: 900px) {
  .app { max-width: 1140px }
  .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 440px); column-gap: 48px; grid-template-rows: auto auto 1fr; grid-template-areas: "map head" "map ctrl" "map rest" }
  .layout.read, .layout.hist { grid-template-rows: auto 1fr; grid-template-areas: "map head" "map rest" }
  .a-map { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); align-self: start }
  .figure { height: min(70vh, 600px) }
  .slides { overflow: visible; scroll-snap-type: none }
  .slide { flex: 1 1 50% }
  .slide .figure { height: min(66vh, 560px) }
  .slide-cap { display: block }
  .maprow .toggle { visibility: hidden }
  .pair { padding: 24px 16px 16px }
  .pair .figure { height: min(62vh, 520px) }
  .greet h1 { font-size: 32px }
  .app { padding-block: 0 40px }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; padding-block: 14px }
  .topright { justify-self: end }
  .toptabs { display: flex }
  .toptabs .tabs { padding: 3px }
  .toptabs .tabs button { padding: 7px 18px }
  .dock { display: none }
  .actionbar { display: flex; gap: 10px; position: sticky; bottom: 0; margin-top: -4px; padding-block: 16px 20px; background: linear-gradient(to top, var(--bg) 72%, transparent) }
  .actionbar:empty { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* ---------- Vocabulary ---------- */
const SENS = [
  { k: 'tight', label: 'Tight', def: 'Stiff or restricted. It moves, just not freely.', short: 'stiff, restricted' },
  { k: 'tender', label: 'Tender', def: 'Fine at rest, but sensitive when pressed or loaded.', short: 'sensitive when pressed' },
  { k: 'sore', label: 'Sore', def: 'Aches on its own, like deep muscle fatigue.', short: 'aches on its own' },
  { k: 'pain', label: 'Pain', def: 'Sharp, pinching or worrying. Get it checked rather than train through it.', short: 'sharp or worrying' }];
const SENS_BY = Object.fromEntries(SENS.map(x => [x.k, x]));
const RANK = { tight: 1, tender: 2, sore: 3, pain: 4 };
const TAGS = ['Rest', 'Handstand', 'Upper body', 'Lower body', 'Core', 'Cardio', 'Ski', 'Mobility'];
const EFFORT_RANK = { Light: 1, Moderate: 2, Hard: 3, 'Very hard': 4 };
// Yesterday's training: a list of sessions, each with its own effort. Older entries only had tags + one effort.
function sessionsOf(y) {
  if (!y) return [];
  if (Array.isArray(y.sessions)) return y.sessions;
  return (y.tags || []).filter(t => t !== 'Rest').map(tag => ({ tag, effort: y.effort || null }));
}
function trainingText(y) {
  const ss = sessionsOf(y);
  if (ss.length) return ss.map(x => x.tag + (x.effort ? ` (${x.effort.toLowerCase()})` : '')).join(', ');
  return (y?.tags || []).includes('Rest') ? 'Rest' : '';
}
function packYesterday(d) {
  if (d.rest) return { tags: ['Rest'], effort: null, sessions: [] };
  const ss = d.sessions.map(x => ({ tag: x.tag, effort: x.effort || null }));
  const top = ss.map(x => x.effort).filter(Boolean).sort((a, b) => EFFORT_RANK[b] - EFFORT_RANK[a])[0] || null;
  return { tags: ss.map(x => x.tag), effort: top, sessions: ss };
}
const EFFORT = ['Light', 'Moderate', 'Hard', 'Very hard'];
const ENERGY = ['Drained', 'Low', 'Steady', 'Fresh'];
const NAMES = { neck: 'neck', upper_trap: 'upper traps', front_delt: 'front shoulder', side_delt: 'side shoulder', rear_delt: 'rear shoulder',
  shoulder_blade: 'shoulder blade', chest: 'chest', biceps: 'biceps', triceps: 'triceps', forearm: 'forearm', abs: 'abs', obliques: 'obliques',
  hip_flexor: 'hip flexor', quads: 'quads', inner_thigh: 'inner thigh', shin: 'shin', upper_back: 'upper back', lats: 'lats',
  lower_back: 'lower back', glutes: 'glutes', hamstrings: 'hamstrings', calves: 'calf' };
function regionLabel(key) {
  const m = key.match(/^(.*)_(L|R)$/);
  const base = m ? m[1] : key, side = m ? (m[2] === 'L' ? 'Left ' : 'Right ') : '';
  const n = NAMES[base] || base.replace(/_/g, ' ');
  return side ? side + n : n.charAt(0).toUpperCase() + n.slice(1);
}
const lc = s => s.charAt(0).toLowerCase() + s.slice(1);
// Each tappable block has its own name; blocks roll up into a muscle group for patterns and History.
const AREA_NAMES = { neck_front: 'front of neck', neck_back: 'back of neck', upper_trap: 'upper traps', front_delt: 'front shoulder', side_delt: 'side shoulder',
  rear_delt: 'rear shoulder', shoulder_blade: 'shoulder blade', upper_back: 'upper back', lats: 'lats', chest_upper: 'upper chest', chest_mid: 'mid chest',
  chest_lower: 'lower chest', biceps_inner: 'inner biceps', biceps_outer: 'outer biceps', triceps: 'triceps', forearm_inner: 'inner forearm',
  forearm_mid: 'mid forearm', forearm_outer: 'outer forearm', forearm_back: 'back of forearm', forearm_back_outer: 'outer back of forearm',
  abs_1: 'upper abs', abs_2: 'mid-upper abs', abs_3: 'mid-lower abs', abs_4: 'lower abs', side_ribs: 'side ribs', obliques_upper: 'upper obliques',
  obliques_lower: 'lower obliques', hip_flexor: 'hip flexor', quad_front: 'front of thigh', quad_outer: 'outer thigh', inner_thigh: 'inner thigh',
  shin_inner: 'shin', shin_outer: 'outer lower leg', lower_back: 'lower back', back_waist: 'back of waist', glute_upper: 'upper glute', glute: 'glute',
  hamstring_outer: 'outer hamstring', hamstring_inner: 'inner hamstring', calf_outer: 'outer calf', calf_inner: 'inner calf' };
const AREA = {};
for (const side of ['front', 'back']) for (const x of BODY[side].paths) if (x.k === 'm') AREA[x.r] = { g: x.g };
const groupOf = k => (AREA[k] && AREA[k].g) || k;
function labelOf(k) {
  if (!AREA[k]) return regionLabel(k); // older entries stored whole muscles
  const m = k.match(/^(.*)_(L|R)$/), base = m ? m[1] : k;
  return (m ? (m[2] === 'L' ? 'Left ' : 'Right ') : '') + (AREA_NAMES[base] || base.replace(/_/g, ' '));
}

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return isoDate(d); };
const dayDiff = (a, b) => Math.round((fromIso(a) - fromIso(b)) / 864e5);
const fmtDay = s => fromIso(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtShort = s => fromIso(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const TODAY = isoDate(new Date());

/* ---------- Safe storage (demo only) ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Demo journal: four weeks of example mornings ---------- */
function makeDemo() {
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const plan = d => { // training done on date d
    const wd = fromIso(d).getDay(); const weeksAgo = Math.floor(dayDiff(TODAY, d) / 7);
    return ({ 1: { tags: ['Handstand', 'Upper body'], effort: 'Hard' }, 2: { tags: ['Lower body'], effort: 'Moderate' }, 3: { tags: ['Rest'], effort: null },
      4: { tags: ['Handstand', 'Core'], effort: 'Hard' }, 5: { tags: ['Upper body'], effort: 'Hard' },
      6: weeksAgo % 2 === 0 ? { tags: ['Ski'], effort: 'Very hard' } : { tags: ['Cardio'], effort: 'Moderate' },
      0: { tags: ['Mobility'], effort: 'Light' } })[wd];
  };
  const notes = ['Shoulder pinched slightly at the top of the last handstand hold.', 'Long desk day, neck stiff by the evening.', 'Slept badly, everything feels heavy.', 'Legs felt springy on the slopes.', 'Kept the overhead press lighter than planned.'];
  const out = [];
  for (let ago = 27; ago >= 1; ago--) {
    const date = addDays(TODAY, -ago), y = plan(addDays(date, -1));
    const marks = [], add = (r, s) => { if (!marks.some(m => m.r === r)) marks.push({ r, s }); };
    const upper = y.tags.includes('Handstand') || y.tags.includes('Upper body');
    const late = ago <= 10;
    if (upper && y.effort === 'Hard' && rnd() < (late ? 0.95 : 0.6)) add('front_delt_L', late && rnd() < .5 ? 'sore' : 'tender', late ? 2 + (rnd() < .4 ? 1 : 0) : 1 + (rnd() < .4 ? 1 : 0));
    if (upper && rnd() < .45) add('upper_trap_L', 'tight', 1 + (rnd() < .3 ? 1 : 0));
    if (y.tags.includes('Lower body')) { add('quad_front_L', 'sore', 2); add('quad_front_R', 'sore', 2); if (rnd() < .5) add('glute_R', 'tight', 1); }
    if (y.tags.includes('Ski')) { add('quad_front_L', 'sore', 3); add('quad_front_R', 'sore', 2 + (rnd() < .5 ? 1 : 0)); add('lower_back_L', 'tight'); add('lower_back_R', 'tight'); }
    if (y.tags.includes('Cardio') && rnd() < .6) { add('calf_inner_L', 'tight', 1); add('calf_inner_R', 'tight', 1); }
    if (y.tags.includes('Core') && rnd() < .5) { add('abs_2_L', 'sore'); add('abs_2_R', 'sore'); }
    if (rnd() < .22) { add('neck_back_L', 'tight'); add('neck_back_R', 'tight'); }
    const load3 = [1, 2, 3].map(k => plan(addDays(date, -k))).filter(p => p.effort === 'Hard' || p.effort === 'Very hard').length;
    const energy = load3 >= 3 ? 'Low' : load3 === 2 ? (rnd() < .5 ? 'Low' : 'Steady') : rnd() < .5 ? 'Steady' : 'Fresh';
    const note = rnd() < .22 ? notes[Math.floor(rnd() * notes.length)] : '';
    const yesterday = y.tags.includes('Rest') ? { tags: ['Rest'], effort: null, sessions: [] } : { tags: y.tags, effort: y.effort, sessions: y.tags.map(tag => ({ tag, effort: y.effort })) };
    out.push({ date, marks, energy, yesterday, note, demo: true });
  }
  return out;
}

/* ---------- Rules layer: facts computed from the log ---------- */
function computeFacts(all, entry) {
  const hist = all.filter(e => e.date < entry.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const within = n => hist.filter(e => dayDiff(entry.date, e.date) <= n);
  const facts = []; let n = 0;
  const add = (text, dates, kind, r) => { const id = 'F' + (++n); facts.push({ id, text, dates: dates || [], kind, r }); return id; };
  add(`${hist.length + 1} ${hist.length ? 'mornings' : 'morning'} logged so far, including today.`, [], 'baseline');
  const y = entry.yesterday || {};
  if (trainingText(y)) add(`Yesterday: ${trainingText(y)}.`, [], 'yesterday');
  const pain = entry.marks.filter(m => m.s === 'pain');
  if (pain.length) add(`Pain marked on ${pain.map(m => lc(labelOf(m.r))).join(', ')}.`, [entry.date], 'pain');
  const seenGroups = new Set();
  for (const m of [...entry.marks].sort((a, b) => RANK[b.s] - RANK[a.s])) {
    const g = groupOf(m.r); if (seenGroups.has(g)) continue; seenGroups.add(g);
    const name = regionLabel(g), inG = e => e.marks.filter(x => groupOf(x.r) === g), hasG = e => inG(e).length > 0;
    const f14 = within(14).filter(hasG), f28 = within(28).filter(hasG);
    let streak = 1; while (hist.some(e => e.date === addDays(entry.date, -streak) && hasG(e))) streak++;
    if (f14.length >= 2) add(`${name} flagged on ${f14.length} other mornings in the last 14 days.`, f14.map(e => e.date), 'recurring', g);
    else if (f28.length === 0 && hist.length >= 7) add(`First time ${lc(name)} has been flagged in 4 weeks.`, [], 'new', g);
    if (streak >= 3) add(`${name} flagged ${streak} mornings in a row.`, [], 'streak', g);
    if (f28.length >= 3) {
      const count = {};
      f28.forEach(e => (e.yesterday?.tags || []).filter(t => t !== 'Rest').forEach(t => count[t] = (count[t] || 0) + 1));
      const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
      if (best && best[1] >= 2 && best[1] / f28.length >= .5) add(`${best[1]} of ${f28.length} ${lc(name)} flags in 4 weeks came the morning after a day tagged ${best[0]}.`, f28.filter(e => e.yesterday?.tags?.includes(best[0])).map(e => e.date), 'link', g);
    }
    const prev = f14.slice(-3).map(e => Math.max(...inG(e).map(x => RANK[x.s] || 0)));
    if (prev.length >= 2 && RANK[m.s] > Math.max(...prev)) add(`${name} is ${m.s} today, a step up from its last ${prev.length} flags.`, f14.slice(-3).map(e => e.date), 'rising', g);
  }
  const hard = [entry, ...hist.slice(-3)].filter(e => ['Hard', 'Very hard'].includes(e.yesterday?.effort));
  if (hard.length >= 3) add(`Hard or very hard sessions behind ${hard.length} of the last 4 mornings.`, hard.map(e => e.date), 'load');
  const lowRun = [entry, ...hist.slice(-2).reverse()].filter(e => ['Drained', 'Low'].includes(e.energy));
  if (lowRun.length >= 3) add('Energy low or drained 3 mornings running.', lowRun.map(e => e.date), 'energy');
  if (!entry.marks.length) add('No sensations marked this morning.', [], 'clear');
  return facts;
}

/* ---------- Read-back: Claude writes, rules decide what is true ---------- */
function historyLine(e) {
  const marks = e.marks.length ? e.marks.map(m => `${lc(labelOf(m.r))} ${m.s}`).join('; ') : 'nothing marked';
  const y = trainingText(e.yesterday) || 'not logged';
  return `${e.date} | trained yesterday: ${y} | energy: ${e.energy || 'n/a'} | marks: ${marks}${e.note ? ' | note: ' + e.note : ''}`;
}
function sanitize(raw, facts) {
  const ids = new Set(facts.map(f => f.id));
  const call = ['train', 'modify', 'rest'].includes(raw?.suggestion?.call) ? raw.suggestion.call : 'modify';
  return {
    day: String(raw?.day || '').replace(/[.!]+$/, '').split(/\s+/).filter(Boolean).slice(0, 4).join(' '),
    headline: String(raw?.headline || 'Logged').slice(0, 90),
    read: String(raw?.read || '').slice(0, 600),
    patterns: (Array.isArray(raw?.patterns) ? raw.patterns : []).slice(0, 3).map(p => ({ text: String(p.text || ''), facts: (p.facts || []).filter(f => ids.has(f)) })).filter(p => p.text),
    suggestion: { call, title: String(raw?.suggestion?.title || '').slice(0, 60), steps: (raw?.suggestion?.steps || []).slice(0, 3).map(String) },
    confidence: ['low', 'medium', 'high'].includes(raw?.confidence) ? raw.confidence : 'low',
    confidence_reason: String(raw?.confidence_reason || ''),
    tomorrow: String(raw?.tomorrow || '')
  };
}
function rulesReadback(entry, facts) {
  const pick = k => facts.filter(f => f.kind === k);
  const strong = entry.marks.filter(m => m.s === 'sore'), pain = pick('pain').length;
  const rec = [...pick('recurring'), ...pick('link'), ...pick('streak'), ...pick('rising')];
  let call = 'train', title = 'Train as planned', steps = ['Warm up the areas you marked before loading them.'];
  if (pain) { call = 'modify'; title = 'Train around the marked area'; steps = ['Leave the painful area unloaded today.', 'Choose work that keeps it out of the movement.']; }
  else if (strong.length || pick('streak').length || pick('rising').length) { call = 'modify'; title = 'Lighter session today'; steps = ['Cut load and volume on the flagged areas by about a quarter.', 'Spend the saved time on mobility for those areas.']; }
  if (pick('energy').length && pick('load').length) { call = 'rest'; title = 'Take a recovery day'; steps = ['Keep movement easy: a walk or gentle mobility.']; }
  const head = pain ? 'Pain marked, so the fixed rule applies' : rec.length ? `${regionLabel(rec[0].r)} keeps coming back` : entry.marks.length ? 'Logged. Still learning your baseline' : 'A clear morning';
  return {
    day: '',
    headline: head,
    read: rec.length ? rec[0].text : 'Nothing in your recent log stands out yet. The written read-back needs Claude, which is not available in this view.',
    patterns: rec.slice(1, 4).map(f => ({ text: f.text, facts: [f.id] })),
    suggestion: { call, title, steps },
    confidence: 'low', confidence_reason: 'Written by fixed rules only, without Claude.', tomorrow: entry.marks.length ? `Check whether ${lc(labelOf(entry.marks[0].r))} has eased.` : ''
  };
}
function dayName(entry, rb) {
  if (entry.marks.some(m => m.s === 'pain')) return 'Protect and rest';
  if (!entry.marks.length) return 'Full recovery';
  return { train: 'Ready to train', modify: 'Train with care', rest: 'Recovery day' }[rb.suggestion.call] || 'Train with care';
}
async function readBody(entry, all) {
  const facts = computeFacts(all, entry);
  const history = all.filter(e => e.date < entry.date).sort((a, b) => a.date < b.date ? -1 : 1).slice(-21).map(historyLine);
  let rb = null, by = 'rules', notice = '';
  try {
    const r = await fetch('/api/read', { method: 'POST', headers: { 'content-type': 'application/json', ...(ownerKey ? { 'x-owner-key': ownerKey } : {}) },
      body: JSON.stringify({ today: historyLine(entry), facts: facts.map(({ id, text }) => ({ id, text })), history }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.readback) { rb = sanitize(j.readback, facts); by = 'claude'; }
    else notice = r.status === 429 ? 'Today’s Claude read-backs are used up, so this read uses fixed rules only.'
      : r.status === 503 ? 'Claude isn’t connected on this site yet, so this read uses fixed rules only.'
      : 'Claude couldn’t answer just now, so this read uses fixed rules only.';
  } catch (e) { notice = 'Claude couldn’t be reached, so this read uses fixed rules only.'; }
  if (!rb) rb = rulesReadback(entry, facts);
  if (!rb.day) rb.day = dayName(entry, rb);
  const pain = entry.marks.filter(m => m.s === 'pain').map(m => m.r);
  if (pain.length && rb.suggestion.call === 'train') rb.suggestion.call = 'modify';
  return { ...rb, by, notice, facts, pain, at: new Date().toISOString(), mornings: all.filter(e => e.date < entry.date).length + 1 };
}

/* ---------- Body map rendering ---------- */
let gradN = 0;
function figure(side, opts = {}) {
  const b = BODY[side], g = 'outlineGrad'; gradN++;
  const id = `${g}${gradN}`;
  const marks = opts.marks || [], heat = opts.heat || null;
  const paths = b.paths.map(p => {
    const fr = p.e ? ' fill-rule="evenodd"' : '';
    if (p.k !== 'm') return `<path class="${p.k}"${fr} d="${p.d}"${p.k === 'o' ? ` style="fill:url(#${id})"` : ''}/>`;
    let cls = 'm';
    const mk = markFor(marks, p);
    if (mk) cls += ` s-${mk.s}${opts.live && S.last && S.last.r === p.r ? ' last' : ''}`;
    else if (heat && heat[p.g]) cls += ' h' + (heat[p.g] >= 5 ? 3 : heat[p.g] >= 3 ? 2 : 1);
    const a11y = opts.live ? ` tabindex="0" role="button" aria-label="${esc(labelOf(p.r))}"` : '';
    return `<path class="${cls}" data-r="${p.r}"${fr} d="${p.d}"${a11y}><title>${esc(labelOf(p.r))}</title></path>`;
  }).join('');
  // The front is mirrored, so the body's left is on the screen's left in both views.
  const w = b.vb.split(/\s+/)[2];
  return `<svg class="figure${opts.live ? ' live' : ''}" viewBox="${b.vb}" role="img" aria-label="${side === 'front' ? 'Front' : 'Back'} of body" data-side="${side}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" class="stop-a"/><stop offset="1" class="stop-b"/></linearGradient></defs><g${side === 'front' ? ` transform="matrix(-1 0 0 1 ${w} 0)"` : ''}>${paths}</g></svg>`;
}
// A mark names one block; marks saved before blocks existed name a whole muscle and light all of its blocks.
const markFor = (marks, p) => marks.find(m => m.r === p.r) || marks.find(m => m.r === p.g);
function paintFigure(svg, marks) {
  svg.querySelectorAll('.m').forEach(el => {
    el.setAttribute('class', 'm');
    const mk = markFor(marks, { r: el.dataset.r, g: groupOf(el.dataset.r) });
    if (mk) el.classList.add('s-' + mk.s);
    if (mk && S.last && S.last.r === el.dataset.r && svg.classList.contains('live')) el.classList.add('last');

}

}

}
function setupSlides() {

function customTags() {

}
function renderTraining() {

function toggleTag(tag) {
  const y = S.draft.yesterday;
  if (tag === 'Rest') { y.rest = !y.rest; if (y.rest) y.sessions = []; return; }
  y.rest = false;

  if (i >= 0) y.sessions.splice(i, 1); else y.sessions.push({ tag, effort: null });
}
function addCustomTag(raw) {
  const name = raw.replace(/\s+/g, ' ').trim().slice(0, 24);
  if (!name) return;
  const tag = name.charAt(0).toUpperCase() + name.slice(1);
  const existing = [...TAGS, ...customTags()].find(t => t.toLowerCase() === tag.toLowerCase());
  if (!existing) store.set('soma-custom-tags', [...(store.get('soma-custom-tags') || []), tag]);
  const use = existing || tag;
  if (!S.draft.yesterday.sessions.some(x => x.tag === use)) toggleTag(use);

/* Voice note: the browser's own speech recognition, where available */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function setupMic() { const b = document.getElementById('mic'); if (b) { b.hidden = !SpeechRec; b.setAttribute('aria-pressed', String(!!rec)); } }
function toggleMic() {
  const b = document.getElementById('mic'), st = document.getElementById('micStatus'), ta = document.getElementById('note');
  if (rec) { rec.stop(); return; }
  try {
    rec = new SpeechRec(); rec.lang = navigator.language || 'en-GB'; rec.interimResults = true; rec.continuous = true;
    const base = ta.value.trim() ? ta.value.trim() + ' ' : ''; let finalText = '';
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
      ta.value = (base + finalText + interim).slice(0, 500); if (S.draft) S.draft.note = ta.value;
    };
    rec.onerror = e => { st.hidden = false; st.textContent = (e.error === 'not-allowed' || e.error === 'service-not-allowed') ? 'Microphone access is blocked. Allow it in your browser settings to dictate.' : e.error === 'no-speech' ? 'Didn’t catch anything. Tap the microphone and try again.' : 'Dictation stopped.'; };
    rec.onend = () => { rec = null; const bb = document.getElementById('mic'); if (bb) bb.setAttribute('aria-pressed', 'false'); const s2 = document.getElementById('micStatus'); if (s2 && s2.dataset.listening) { s2.hidden = true; delete s2.dataset.listening; } };
    rec.start();
    b.setAttribute('aria-pressed', 'true'); st.hidden = false; st.dataset.listening = '1'; st.textContent = 'Listening. Tap the microphone again to stop.';
  } catch (err) { rec = null; st.hidden = false; st.textContent = 'Dictation isn’t available in this browser.'; }
}

// Tap to step through: tight, tender, sore, pain, then clear.
function toggleRegion(r) {
  const d = S.draft, i = d.marks.findIndex(m => m.r === r);
  const next = LEVELS[(LEVELS.indexOf(i >= 0 ? d.marks[i].s : null) + 1) % LEVELS.length];
  if (!next) d.marks.splice(i, 1); else if (i >= 0) d.marks[i].s = next; else d.marks.push({ r, s: next });

  refreshLog();
}

/* ---------- Calendar ---------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const strongest = e => e.marks.reduce((top, m) => RANK[m.s] > (RANK[top] || 0) ? m.s : top, null);
function dayClass(date, byDate) {
  const e = byDate[date];
  let c = date > TODAY ? 'future' : !e ? 'empty' : e.marks.length ? 'lv-' + strongest(e) : 'clear';
  if (date === TODAY) c += ' today';
  if (date === S.calSel) c += S.calPinned ? ' sel pin' : ' sel';
  return c;
}
function dayLabel(date, byDate) {
  const e = byDate[date];
  return `${fmtDay(date)}: ${date > TODAY ? 'not yet' : !e ? 'nothing logged' : e.marks.length ? e.marks.length + (e.marks.length === 1 ? ' area marked' : ' areas marked') : 'clear morning'}`;
}
function monthCells(y, m, byDate) {
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let html = '<span class="cblank"></span>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const date = isoDate(new Date(y, m, d));
    html += `<button type="button" class="cday ${dayClass(date, byDate)}" data-day="${date}" aria-label="${esc(dayLabel(date, byDate))}" ${date > TODAY ? 'disabled' : ''}></button>`;
  }
  return html;
}
function dayDetail(date, byDate) {
  const e = byDate[date];

  if (!e) return `${head}<p class="cd-title">${date > TODAY ? 'Not yet' : 'Nothing logged'}</p>`;
  const marks = [...e.marks].sort((a, b) => RANK[b.s] - RANK[a.s]);

  return `${head}
    <p class="cd-title">${marks.length ? marks.length + (marks.length === 1 ? ' area marked' : ' areas marked') : 'A clear morning'}</p>
    ${marks.length ? `<div class="cd-marks">${marks.slice(0, 5).map(m => `<span class="cd-mark" data-s="${m.s}">${esc(labelOf(m.r))}<b>${SENS_BY[m.s].label}</b></span>`).join('')}${marks.length > 5 ? `<span class="cd-more">and ${marks.length - 5} more</span>` : ''}</div>` : ''}
    <p class="cd-meta">${esc(trainingText(e.yesterday) ? 'After ' + trainingText(e.yesterday) : 'Training not logged')}${e.energy ? ' · ' + e.energy.toLowerCase() + ' energy' : ''}</p>
    ${e.readback ? `<p class="cd-meta">Suggested: ${callLabel[e.readback.suggestion.call]}</p>` : ''}
    <button type="button" class="linkbtn cd-open" data-open="${date}">Open this morning</button>`;
}
function calendarHtml() {
  const byDate = Object.fromEntries(entries().map(e => [e.date, e]));

  if (!S.calSel) S.calSel = byDate[TODAY] ? TODAY : (Object.keys(byDate).filter(d => d <= TODAY).sort().pop() || TODAY);
  const cur = fromIso(S.calCursor), y = cur.getFullYear(), m = cur.getMonth();

      <div class="mini-tabs" role="group" aria-label="Calendar range"><button type="button" data-calmode="month" aria-pressed="${!year}">Month</button><button type="button" data-calmode="year" aria-pressed="${year}">Year</button></div></div>

// Hover previews a day; a click or tap pins it so the details stay put. Clicking the pinned day again releases it.

function previewDay(date) { if (date && date <= TODAY && !S.calPinned && date !== S.calSel) showDay(date); }
function pinDay(date) {

}

function renderHistory() {
  const all = [...entries()].sort((a, b) => a.date < b.date ? 1 : -1);

  const heat = {}, sensCount = {};
  recent.forEach(e => { new Set(e.marks.map(m => groupOf(m.r))).forEach(g => heat[g] = (heat[g] || 0) + 1); e.marks.forEach(m => { const g = groupOf(m.r); sensCount[g] = sensCount[g] || {}; sensCount[g][m.s] = (sensCount[g][m.s] || 0) + 1; }); });
  const tops = Object.entries(heat).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const max = Math.max(1, ...tops.map(t => t[1]));
  view.innerHTML = `<div class="layout hist"><div class="a-head">${header({ eyebrow: `${all.length} ${all.length === 1 ? 'morning' : 'mornings'} logged`, title: 'History' })}<section class="sect"><h2>Last 14 days</h2><p class="hint">Darker areas on the body were flagged on more mornings.</p></section></div>

  <div class="a-rest">${tops.length ? `<div class="card"><p class="label">Most flagged</p><div class="tops">${tops.map(([r, c]) => { const s = Object.entries(sensCount[r]).sort((a, b) => b[1] - a[1])[0][0]; return `<div class="top-row"><span>${esc(regionLabel(r))} <span style="color:var(--ink-3);font-size:13px">· mostly ${s}</span></span><span class="bar"><i style="width:${c / max * 100}%"></i></span><span class="num">${c}</span></div>`; }).join('')}</div></div>` : ''}

  setActions(''); setupSlides();
}

/* ---------- Persistence ---------- */
async function persist(entry) {
  if (S.mode === 'live') {
    const r = await fetch('/api/journal', { method: 'PUT', headers: { 'content-type': 'application/json', 'x-owner-key': ownerKey }, body: JSON.stringify(entry) });
    if (!r.ok) throw { code: r.status === 401 ? 'locked' : 'save_failed' };
    const i = S.live.findIndex(e => e.date === entry.date); if (i >= 0) S.live[i] = entry; else S.live.push(entry);
  } else {
    const i = S.demo.findIndex(e => e.date === entry.date); if (i >= 0) S.demo[i] = entry; else S.demo.push(entry);
    store.set('soma-demo-own', S.demo.filter(e => !e.demo));
  }
}
async function saveAndRead() {
  if (S.busy) return;
  const d = S.draft; d.note = (document.getElementById('note')?.value || '').trim().slice(0, 500);
  const prev = entryFor(TODAY);
  if (rec) rec.stop();
  const entry = { date: TODAY, marks: d.marks, energy: d.energy, yesterday: packYesterday(d.yesterday), note: d.note, createdAt: prev?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
  S.busy = true; S.status = 'Saving…'; render();
  try { await persist(entry); }
  catch (e) { S.busy = false; S.status = e?.code === 'quota_exceeded' ? 'Your journal is full. Remove old mornings before adding more.' : 'Could not save. Check your connection and try again.'; return render(); }
  S.editing = false; S.draft = null; S.status = ''; render();
  entry.readback = await readBody(entry, entries());
  try { await persist(entry); } catch (e) {}
  S.busy = false; render();
}
async function reread(date) {
  const e = entryFor(date); if (!e || S.busy) return;
  S.busy = true; render();
  e.readback = await readBody(e, entries());
  try { await persist(e); } catch (err) {}
  S.busy = false; render();
}

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, path.m'); if (!t) return;
  if (t.id === 'ownerBtn') {
    if (caps.owner) { lock(); return render(); }
    const f = document.getElementById('ownerForm'); f.hidden = !f.hidden; if (!f.hidden) document.getElementById('ownerKey').focus(); return;
  }
  if (t.id === 'ownerCancel') { document.getElementById('ownerForm').hidden = true; document.getElementById('ownerStatus').textContent = ''; return; }
  if (t.matches('#modeLive') && caps.owner) { S.mode = 'live'; S.draft = null; S.editing = false; S.openDate = null; return render(); }
  if (t.matches('#modeDemo')) { S.mode = 'demo'; S.draft = null; S.editing = false; S.openDate = null; return render(); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.openDate = null; window.scrollTo(0, 0); return render(); }
  if (t.dataset.side) return setSide(t.dataset.side, true);
  if (t.dataset.act === 'clearmap') { if (!S.draft.marks.length) return; S.cleared = S.draft.marks; S.draft.marks = []; S.last = null; return refreshLog(); }
  if (t.dataset.act === 'undoclear') { if (S.cleared) { S.draft.marks = S.cleared; S.cleared = null; } return refreshLog(); }
  if (t.matches('path.m') && t.closest('.figure.live')) return toggleRegion(t.dataset.r);
  if (t.dataset.unmark) { S.draft.marks = S.draft.marks.filter(m => m.r !== t.dataset.unmark); S.last = { r: t.dataset.unmark, s: null }; S.cleared = null; return refreshLog(); }
  if (t.dataset.ytag) { toggleTag(t.dataset.ytag); return renderTraining(); }
  if (t.dataset.eff) { const x = S.draft.yesterday.sessions[+t.dataset.sess]; if (x) x.effort = x.effort === t.dataset.eff ? null : t.dataset.eff; return renderTraining(); }
  if (t.hasAttribute('data-addtag')) { S.adding = true; renderTraining(); document.getElementById('newTag')?.focus(); return; }
  if (t.hasAttribute('data-canceladd')) { S.adding = false; return renderTraining(); }
  if (t.id === 'mic') return toggleMic();
  if (t.dataset.energy) { S.draft.energy = S.draft.energy === t.dataset.energy ? null : t.dataset.energy; view.querySelectorAll('[data-energy]').forEach(b => b.setAttribute('aria-pressed', b.dataset.energy === S.draft.energy)); return; }
  if (t.dataset.act === 'closedemo') return closeDemo();
  if (t.dataset.act === 'save') return saveAndRead();
  if (t.dataset.act === 'edit') { S.editing = true; S.draft = null; S.last = null; S.cleared = null; window.scrollTo(0, 0); return render(); }
  if (t.dataset.act === 'cancel') { S.editing = false; S.draft = null; return render(); }
  if (t.id === 'reread') return reread(S.openDate || TODAY);
  if (t.dataset.day) return pinDay(t.dataset.day);
  if (t.hasAttribute('data-unpin')) { S.calPinned = false; return showDay(S.calSel); }
  if (t.dataset.hview) { S.histView = t.dataset.hview; store.set('soma-hist-view', S.histView); return render(); }
  if (t.dataset.calmode) { S.calMode = t.dataset.calmode; return render(); }
  if (t.dataset.calnav) {
    const c = fromIso(S.calCursor || TODAY.slice(0, 7) + '-01'), step = +t.dataset.calnav;
    const next = S.calMode === 'year' ? new Date(c.getFullYear() + step, 0, 1) : new Date(c.getFullYear(), c.getMonth() + step, 1);
    S.calCursor = isoDate(next); return render();
  }
  if (t.dataset.open) { S.openDate = t.dataset.open; window.scrollTo(0, 0); return render(); }
  if (t.id === 'backHist') { S.openDate = null; return render(); }
});
document.addEventListener('mouseover', ev => {
  const d = ev.target.closest && ev.target.closest('.cday');
  if (d && matchMedia('(hover: hover)').matches) previewDay(d.dataset.day);
});
document.addEventListener('input', ev => { if (ev.target.id === 'note' && S.draft) S.draft.note = ev.target.value; });
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'addForm') return;
  ev.preventDefault(); addCustomTag(document.getElementById('newTag').value); S.adding = false; renderTraining();
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.figure.live path.m')) { ev.preventDefault(); toggleRegion(ev.target.dataset.r); }
});

/* ---------- Owner access ---------- */
const validEntry = e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && Array.isArray(e.marks);
async function unlock(key) {
  try {
    const r = await fetch('/api/journal', { headers: { 'x-owner-key': key } });
    if (r.ok) {
      const j = await r.json();
      S.live = (j.entries || []).filter(validEntry);
      caps.owner = true; ownerKey = key; store.set('soma-owner-key', key);
      S.mode = 'live'; S.draft = null; S.last = null; S.cleared = null; S.editing = false; S.openDate = null; S.tab = 'today';
      return 'ok';
    }
    if (r.status === 401) { store.set('soma-owner-key', null); return 'wrong'; }
    return r.status === 503 ? 'storage' : 'error';
  } catch (e) { return 'offline'; }
}
function lock() {
  caps.owner = false; ownerKey = null; store.set('soma-owner-key', null);
  S.live = []; S.mode = 'demo'; S.draft = null; S.editing = false; S.openDate = null;
}
document.getElementById('ownerForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const input = document.getElementById('ownerKey'), status = document.getElementById('ownerStatus');
  status.textContent = 'Checking…';
  const res = await unlock(input.value);
  status.textContent = { ok: '', wrong: 'That passcode didn’t work.', storage: 'Journal storage isn’t set up on the server yet.', error: 'The server couldn’t open the journal. Try again in a moment.', offline: 'Couldn’t reach the server. Check your connection.' }[res];
  if (res === 'ok') { input.value = ''; document.getElementById('ownerForm').hidden = true; render(); }
});

/* ---------- Start ---------- */
(async function start() {
  const own = (store.get('soma-demo-own') || []).filter(validEntry);
  S.demo = [...makeDemo().filter(g => !own.some(o => o.date === g.date)), ...own];
  const key = store.get('soma-owner-key');
  if (key && await unlock(key) === 'ok') return render();
  S.mode = 'demo'; render();
})();
</script>
